name: Bug report
description: Report a routing, packaging, or runtime bug in dsh-loop-dock.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: dock-version
    attributes:
      label: dsh-loop-dock version
      placeholder: e.g. 0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: e.g. 0.1.0-rc.6
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the profile patch and commands where possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
